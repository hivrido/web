<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FOLLOW FEST</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Montserrat, sans-serif;
      background: radial-gradient(circle at top, #1a0033, #000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,0,200,0.3);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      background: linear-gradient(90deg, #ff00cc, #6a00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 20px;
    }

    .field { margin-top: 12px; }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      outline: none;
      background: rgba(255,255,255,0.08);
      color: white;
      font-family: Montserrat, sans-serif;
      font-size: 14px;
      transition: border-color .2s;
    }
    input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.35); }
    select option { background: #1a0033; color: white; }
    input:focus, select:focus, textarea:focus { border-color: rgba(255,0,200,0.5); }
    input.err, select.err, textarea.err { border-color: #ff4466; }

    .err-msg {
      font-size: 11px;
      color: #ff4466;
      margin-top: 4px;
      display: none;
    }
    .err-msg.show { display: block; }

    textarea { resize: vertical; min-height: 90px; }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff00cc, #6a00ff);
      color: white;
      font-family: Montserrat, sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      letter-spacing: .05em;
      transition: opacity .2s;
    }
    button:hover { opacity: .88; }
  </style>
</head>
<body>

<div class="card">
  <h1>FOLLOW FEST</h1>
  <p class="subtitle">Lista exclusiva · 9 de Mayo · Adrogué</p>

  <form id="form" novalidate>

    <div class="field">
      <input type="text" id="nombre" placeholder="Nombre completo">
      <p class="err-msg" id="err-nombre">Este campo es requerido</p>
    </div>

    <div class="field">
      <input type="text" id="instagram" placeholder="@instagram">
      <p class="err-msg" id="err-instagram">Ingresá tu usuario de Instagram</p>
    </div>

    <div class="field">
      <input type="tel" id="telefono" placeholder="Teléfono">
      <p class="err-msg" id="err-telefono">Este campo es requerido</p>
    </div>

    <div class="field">
      <select id="creador">
        <option value="">¿Sos artista o creador de contenido?</option>
        <option value="Sí">Sí</option>
        <option value="No">No</option>
      </select>
      <p class="err-msg" id="err-creador">Seleccioná una opción</p>
    </div>

    <div class="field">
      <select id="asistencia">
        <option value="">¿Venís solo o acompañado?</option>
        <option value="Solo/a">Solo/a</option>
        <option value="Acompañado/a">Acompañado/a</option>
      </select>
      <p class="err-msg" id="err-asistencia">Seleccioná una opción</p>
    </div>

    <div class="field">
      <input type="number" id="cantidad" placeholder="Cantidad de acompañantes (opcional)" min="0">
    </div>

    <div class="field">
      <textarea id="motivo" placeholder="¿Por qué querés entrar a Follow Fest?"></textarea>
    </div>

    <button type="submit">ENVIAR POR WHATSAPP</button>

  </form>
</div>

<script>
  var NUMERO_WA = "5491154960104";

  function required(id, errId) {
    var el  = document.getElementById(id);
    var err = document.getElementById(errId);
    var val = el.value.trim();
    if (!val) {
      el.classList.add('err');
      err.classList.add('show');
      return false;
    }
    el.classList.remove('err');
    err.classList.remove('show');
    return true;
  }

  // Limpiar error al escribir/cambiar
  ['nombre','instagram','telefono'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', function() {
      this.classList.remove('err');
      var e = document.getElementById('err-' + id);
      if (e) e.classList.remove('show');
    });
  });
  ['creador','asistencia'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', function() {
      this.classList.remove('err');
      var e = document.getElementById('err-' + id);
      if (e) e.classList.remove('show');
    });
  });

  document.getElementById("form").addEventListener("submit", function(e) {
    e.preventDefault();

    var ok = true;
    if (!required('nombre',    'err-nombre'))    ok = false;
    if (!required('instagram', 'err-instagram')) ok = false;
    if (!required('telefono',  'err-telefono'))  ok = false;
    if (!required('creador',   'err-creador'))   ok = false;
    if (!required('asistencia','err-asistencia'))ok = false;
    if (!ok) return;

    var nombre    = document.getElementById("nombre").value.trim();
    var instagram = document.getElementById("instagram").value.trim();
    if (!instagram.startsWith('@')) instagram = '@' + instagram;
    var telefono  = document.getElementById("telefono").value.trim();
    var creador   = document.getElementById("creador").value;
    var asistencia= document.getElementById("asistencia").value;
    var cantidad  = document.getElementById("cantidad").value.trim();
    var motivo    = document.getElementById("motivo").value.trim();

    var mensaje =
"🎟️ *FOLLOW FEST — NUEVA APLICACIÓN*\n\n" +
"*Nombre:* " + nombre + "\n" +
"*Instagram:* " + instagram + "\n" +
"*Teléfono:* " + telefono + "\n" +
"*Artista/Creador:* " + creador + "\n" +
"*Asistencia:* " + asistencia + "\n" +
(cantidad ? "*Acompañantes:* " + cantidad + "\n" : "") +
(motivo   ? "\n*Motivación:*\n" + motivo : "");

    var url = "https://wa.me/" + NUMERO_WA + "?text=" + encodeURIComponent(mensaje);
    window.open(url, "_blank");
  });
</script>

</body>
</html>
