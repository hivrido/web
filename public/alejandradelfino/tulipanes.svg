<svg xmlns="http://www.w3.org/2000/svg" width="220" height="200" viewBox="0 0 220 200">
  <!-- Empapelado del expediente: tulipanes con los colores del campo del hero.
       El mosaico repite sin costuras; cada flor queda dentro de su celda. -->
  <defs>
    <g id="t">
      <path d="M0,2 C1,10 -1,18 0,30" fill="none" stroke="#3E8E2F" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M0,24 C-9,19 -14,11 -13,5 C-6,9 -2,14 0,20 Z" fill="#5FA83A"/>
      <path d="M-9,-6 C-10,-19 -5,-23 -3,-19 L0,-25 L3,-19 C5,-23 10,-19 9,-6 C7,3 -7,3 -9,-6 Z"/>
      <path d="M0,-25 L0,-2" stroke="#fff" stroke-opacity=".35" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>
  <g opacity=".3">
    <use href="#t" x="34" y="44" fill="#E5484D" transform="rotate(-8 34 44)"/>
    <use href="#t" x="128" y="30" fill="#F7B32B" transform="rotate(6 128 30)"/>
    <use href="#t" x="186" y="112" fill="#8E44C9" transform="rotate(-4 186 112)"/>
    <use href="#t" x="84" y="134" fill="#E85D9A" transform="rotate(10 84 134)"/>
    <use href="#t" x="18" y="166" fill="#F27A2E" transform="rotate(-12 18 166)"/>
  </g>
  <g fill="#8E44C9" opacity=".18">
    <circle cx="96" cy="78" r="2.4"/>
    <circle cx="160" cy="176" r="2"/>
    <circle cx="200" cy="40" r="1.8"/>
  </g>
</svg>
